# Local development / try-it-out setup. Deployment (hostname, reverse proxy, image tag)
# lives outside this repo; released images are published to ghcr.io/nadrojisk/isp-outage-monitor.
services:
  isp_monitor:
    build: .
    volumes:
      - ./database:/usr/src/app/database
    ports:
      - "8080:8080"
    container_name: isp_monitor
    restart: always
